<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>工作台</title>
  <style>
/* ===== 工作台 ===== */
:root {
  --bg: #f5f5f7; --card-bg: #ffffff; --primary: #3b82f6; --primary-dark: #2563eb;
  --text: #1f2937; --text-dim: #6b7280; --text-light: #9ca3af; --border: #e5e7eb;
  --blue: #3b82f6; --orange: #f59e0b; --green: #10b981; --red: #ef4444;
  --radius: 16px; --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5; overflow-x:hidden;
}

#app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative; }

/* ===== 顶部栏 ===== */
.header {
  background:linear-gradient(135deg,#1e3a5f,#2d5a87); padding:14px 16px;
  display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100;
}
.header-left { display:flex; align-items:center; gap:10px; }
.logo-icon { font-size:24px; }
.logo-title { font-size:17px; font-weight:700; color:#fff; }
.logo-sub { font-size:11px; color:rgba(255,255,255,0.6); }
.header-right { display:flex; gap:8px; }
.user-badge {
  display:flex; align-items:center; gap:4px; padding:6px 12px; border-radius:20px; border:none;
  background:rgba(255,255,255,0.15); color:rgba(255,255,255,0.8); font-size:13px; cursor:pointer; font-family:inherit;
}
.user-badge.active { background:var(--primary); color:#fff; }

/* ===== 用户视图切换 ===== */
.user-view { display:none; flex:1; }
.user-view.active { display:block; animation:fadeIn .25s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* ===== 黄金：金价卡片 ===== */
.gold-price-card { background:var(--card-bg); margin:12px 16px; border-radius:var(--radius); padding:18px 16px; box-shadow:var(--shadow); }
.gp-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.gp-label { font-size:14px; font-weight:600; }
.gp-refresh { padding:4px 10px; border:none; border-radius:6px; background:#eff6ff; color:var(--primary); font-size:13px; cursor:pointer; }
.gp-value { display:flex; align-items:baseline; gap:6px; margin-bottom:8px; }
.gp-value span:first-child { font-size:42px; font-weight:700; color:var(--blue); }
.gp-unit { font-size:14px; color:var(--text-dim); }
.gp-info { font-size:13px; color:var(--text-light); }

/* ===== 总览卡片 ===== */
.overview-card { background:var(--card-bg); margin:0 16px 12px; border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
.overview-title { font-size:14px; font-weight:600; margin-bottom:14px; }
.overview-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.ov-item { text-align:center; }
.ov-label { font-size:12px; color:var(--text-dim); margin-bottom:4px; }
.ov-value { font-size:22px; font-weight:700; }
.ov-value.blue{color:var(--blue)} .ov-value.orange{color:var(--orange)} .ov-value.green{color:var(--green)} .ov-value.red{color:var(--red)} .ov-value.dark{color:var(--text)}

/* ===== 黄金：交易记录 ===== */
.trade-section { margin:0 16px; padding-bottom:80px; }
.section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.section-header h3 { font-size:15px; font-weight:600; }
.btn-group { display:flex; gap:6px; align-items:center; }
.btn-outline { padding:6px 12px; border:1px solid var(--primary); border-radius:8px; background:#fff; color:var(--primary); font-size:13px; font-weight:500; cursor:pointer; }
.btn-outline:active { background:#eff6ff; }
.btn-primary { padding:12px; border:none; border-radius:10px; background:var(--primary); color:#fff; font-size:15px; font-weight:600; cursor:pointer; flex:1; }
.btn-primary:active { background:var(--primary-dark); }
.btn-cancel { padding:12px; border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--text-dim); font-size:15px; cursor:pointer; flex:1; }
.trade-list { display:flex; flex-direction:column; gap:8px; }
.trade-card { background:var(--card-bg); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:12px; }
.trade-date { font-size:13px; color:var(--text-dim); min-width:90px; }
.trade-weight { font-size:16px; font-weight:600; color:var(--orange); min-width:60px; }
.trade-cost { font-size:15px; color:var(--blue); min-width:80px; }
.trade-profit { font-size:15px; font-weight:600; flex:1; text-align:right; }
.trade-del{color:var(--red);font-size:20px;cursor:pointer;padding:8px 10px;opacity:1;background:#fef2f2;border-radius:8px}
.trade-del:active{background:#fecaca}
.trade-edit{cursor:pointer;padding:8px 10px;font-size:18px;opacity:1;background:#eff6ff;border-radius:8px}
.trade-edit:active{background:#dbeafe}

/* ===== 菜鸟：标签栏 ===== */
.tab-bar { display:flex; background:var(--card-bg); margin:0 16px 12px; border-radius:12px; padding:4px; box-shadow:var(--shadow); gap:4px; }
.tab { flex:1; padding:10px 4px; border:none; border-radius:8px; background:none; color:var(--text-dim); font-size:13px; font-weight:500; cursor:pointer; }
.tab.active { background:var(--primary); color:#fff; }
.tab:active { opacity:.8; }

/* ===== 菜鸟：面板 ===== */
.c-panel { display:none; margin:0 16px; padding-bottom:60px; }
.c-panel.active { display:block; animation:fadeIn .25s; }

/* ===== 数据表格 ===== */
.data-table { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
.dt-header { display:grid; grid-template-columns:1fr 60px 100px; padding:12px 16px; background:#f9fafb; border-bottom:1px solid var(--border); font-size:13px; color:var(--text-dim); font-weight:500; }
.dt-header span:last-child,.dt-row span:last-child,.dt-footer span:last-child { text-align:right; }
.dt-header span:nth-child(2),.dt-row span:nth-child(2),.dt-footer span:nth-child(2) { text-align:center; }
.dt-body { max-height:50vh; overflow-y:auto; }
.dt-row { display:grid; grid-template-columns:1fr 60px 100px; padding:14px 16px; border-bottom:1px solid var(--border); font-size:14px; align-items:center; }
.dt-row:last-child { border-bottom:none; }
.dt-footer { display:grid; grid-template-columns:1fr 60px 100px; padding:14px 16px; background:#f9fafb; border-top:2px solid var(--primary); font-size:14px; font-weight:600; }

/* ===== 菜鸟：记录列表 ===== */
.data-list { display:flex; flex-direction:column; gap:8px; }
.record-card { background:var(--card-bg); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; }
.record-info { flex:1; }
.record-date { font-size:12px; color:var(--text-light); margin-bottom:2px; }
.record-detail { font-size:14px; }
.record-detail .tag { display:inline-block; padding:2px 8px; border-radius:4px; background:#eff6ff; color:var(--primary); font-size:12px; margin-right:6px; }
.record-amount { font-size:18px; font-weight:700; }
.record-del { color:var(--red); font-size:20px; cursor:pointer; padding:8px 10px; margin-left:4px; opacity:1; background:#fef2f2; border-radius:8px; }
.record-del:active { background:#fecaca; }
.record-edit { cursor:pointer; padding:8px 10px; margin-left:4px; font-size:18px; opacity:1; background:#eff6ff; border-radius:8px; }
.record-edit:active { background:#dbeafe; }

/* ===== 悬浮按钮 ===== */
.fab { position:fixed; bottom:24px; right:24px; width:56px; height:56px; border:none; border-radius:50%; background:var(--primary); color:#fff; font-size:28px; font-weight:300; cursor:pointer; box-shadow:0 4px 16px rgba(59,130,246,0.4); z-index:90; display:flex; align-items:center; justify-content:center; }
.fab:active { transform:scale(.95); background:var(--primary-dark); }

/* ===== 弹窗 ===== */
.modal-overlay { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.5); z-index:200; align-items:flex-end; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--card-bg); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px; animation:slideUp .3s; }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.modal-header h3 { font-size:17px; font-weight:600; }
.modal-close { width:32px; height:32px; border:none; border-radius:50%; background:var(--bg); color:var(--text-dim); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.form-row { margin-bottom:14px; }
.form-row label { display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; }
.form-input { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); font-size:15px; outline:none; -webkit-appearance:none; }
.form-input:focus { border-color:var(--primary); }
.modal-footer { display:flex; gap:10px; margin-top:8px; }

.footer { text-align:center; padding:16px; font-size:11px; color:var(--text-light); }
.empty-state { text-align:center; padding:60px 20px; color:var(--text-light); font-size:14px; }

@media(max-width:360px){ .gp-value span:first-child{font-size:36px} .ov-value{font-size:18px} }
  </style>
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header class="header">
      <div class="header-left">
        <div class="logo-icon">📊</div>
        <div class="logo-text">
          <div class="logo-title">工作台</div>
          <div class="logo-sub" id="logoSub">珠珠 · 黄金交易</div>
        </div>
      </div>
      <div class="header-right">
        <button class="user-badge active" id="btnUserZhuzhu">
          <span class="user-icon">💎</span><span class="user-name">珠珠</span>
        </button>
        <button class="user-badge" id="btnUserCainiao">
          <span class="user-icon">🐦</span><span class="user-name">菜鸟</span>
        </button>
        <button class="user-badge" id="btnUserTuku">
          <span>🖼️</span><span>图库</span>
        </button>
      </div>
    </header>

    <!-- ==================== 珠珠：黄金交易 ==================== -->
    <div id="viewZhuzhu" class="user-view active">
      <!-- 实时金价 -->
      <section class="gold-price-card">
        <div class="gp-header">
          <span class="gp-label">实时金价</span>
          <button class="gp-refresh" id="btnRefreshPrice">刷新</button>
        </div>
        <div class="gp-value">
          <span id="goldPrice">--</span><span class="gp-unit">元/克</span>
        </div>
        <div class="gp-info"><span id="goldTime">点击刷新获取金价</span></div>
      </section>

      <!-- 总览 -->
      <section class="overview-card">
        <div class="overview-title">📈 总览</div>
        <div class="overview-grid">
          <div class="ov-item"><div class="ov-label">总克重</div><div class="ov-value orange" id="ovTotalWeight">0g</div></div>
          <div class="ov-item"><div class="ov-label">总成本</div><div class="ov-value blue" id="ovTotalCost">¥0.00</div></div>
          <div class="ov-item"><div class="ov-label">总利润</div><div class="ov-value green" id="ovTotalProfit">+¥0.00</div></div>
          <div class="ov-item"><div class="ov-label">利润率</div><div class="ov-value green" id="ovProfitRate">+0.00%</div></div>
        </div>
      </section>

      <!-- 交易记录 -->
      <section class="trade-section">
        <div class="section-header">
          <h3>📝 交易记录</h3>
          <div class="btn-group">
            <button class="btn-outline" id="btnGoldExport">导出</button>
            <input type="file" id="goldImportFile" accept=".json" style="display:none">
            <button class="btn-outline" id="btnGoldImport">导入</button>
          </div>
        </div>
        <div id="tradeList" class="trade-list"></div>
      </section>
      <button class="fab" id="btnAddGold">+</button>
    </div>

    <!-- ==================== 菜鸟：账目记录 ==================== -->
    <div id="viewCainiao" class="user-view">
      <!-- 总览 -->
      <section class="overview-card">
        <div class="overview-title">📈 总览</div>
        <div class="overview-grid">
          <div class="ov-item"><div class="ov-label">总金额</div><div class="ov-value blue" id="cTotalAmount">¥0.00</div></div>
          <div class="ov-item"><div class="ov-label">总笔数</div><div class="ov-value dark" id="cTotalCount">0</div></div>
          <div class="ov-item"><div class="ov-label">账号数</div><div class="ov-value orange" id="cAccountCount">0</div></div>
          <div class="ov-item"><div class="ov-label">项目数</div><div class="ov-value dark" id="cProjectCount">0</div></div>
        </div>
      </section>

      <!-- 标签切换 -->
      <nav class="tab-bar">
        <button class="tab active" data-tab="cByDate">📅 按日期</button>
        <button class="tab" data-tab="cByAccount">👥 按账号</button>
        <button class="tab" data-tab="cByProject">📁 按项目</button>
        <button class="tab" data-tab="cRecords">📋 记录</button>
      </nav>

      <!-- 按日期 -->
      <div class="c-panel active" id="cByDate">
        <div class="data-table">
          <div class="dt-header"><span>日期</span><span>笔数</span><span>金额</span></div>
          <div id="cByDateBody" class="dt-body"></div>
          <div class="dt-footer"><span>合计</span><span id="cByDateCount">0</span><span id="cByDateAmount">¥0.00</span></div>
        </div>
      </div>
      <!-- 按账号 -->
      <div class="c-panel" id="cByAccount">
        <div class="data-table">
          <div class="dt-header"><span>账号</span><span>笔数</span><span>金额</span></div>
          <div id="cByAccountBody" class="dt-body"></div>
          <div class="dt-footer"><span>合计</span><span id="cByAccountCount">0</span><span id="cByAccountAmount">¥0.00</span></div>
        </div>
      </div>
      <!-- 按项目 -->
      <div class="c-panel" id="cByProject">
        <div class="data-table">
          <div class="dt-header"><span>项目</span><span>笔数</span><span>金额</span></div>
          <div id="cByProjectBody" class="dt-body"></div>
          <div class="dt-footer"><span>合计</span><span id="cByProjectCount">0</span><span id="cByProjectAmount">¥0.00</span></div>
        </div>
      </div>
      <!-- 记录 -->
      <div class="c-panel" id="cRecords">
        <div class="section-header">
          <h3>📋 所有记录</h3>
          <div class="btn-group">
            <button class="btn-outline" id="btnCExport">导出</button>
            <input type="file" id="cImportFile" accept=".json" style="display:none">
            <button class="btn-outline" id="btnCImport">导入</button>
            <button class="btn-primary" id="btnAddRecord">+ 新增</button>
          </div>
        </div>
        <div id="cRecordsList" class="data-list"></div>
      </div>
    </div>

    <!-- ==================== 图库：图片管理 ==================== -->
    <div id="viewTuku" class="user-view">
      <section style="margin:12px 16px;display:flex;gap:8px">
        <input type="text" id="tukuSearch" placeholder="搜索图片标签..." style="flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--card-bg);color:var(--text);font-size:14px;outline:none">
        <button id="tukuSearchBtn" style="padding:12px 16px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:14px;cursor:pointer">搜索</button>
      </section>
      <section style="margin:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap" id="tukuCats">
        <button class="tuku-cat active" data-cat="全部" style="padding:6px 14px;border:1px solid var(--primary);border-radius:20px;background:var(--primary);color:#fff;font-size:13px;cursor:pointer">全部</button>
        <button class="tuku-cat" data-cat="证件" style="padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card-bg);color:var(--text-dim);font-size:13px;cursor:pointer">证件</button>
        <button class="tuku-cat" data-cat="合同" style="padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card-bg);color:var(--text-dim);font-size:13px;cursor:pointer">合同</button>
        <button class="tuku-cat" data-cat="票据" style="padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card-bg);color:var(--text-dim);font-size:13px;cursor:pointer">票据</button>
        <button class="tuku-cat" data-cat="截图" style="padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card-bg);color:var(--text-dim);font-size:13px;cursor:pointer">截图</button>
        <button class="tuku-cat" data-cat="其他" style="padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card-bg);color:var(--text-dim);font-size:13px;cursor:pointer">其他</button>
      </section>
      <div id="tukuGrid" style="margin:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:80px"></div>
      <button class="fab" id="btnUploadImg">+</button>
      <input type="file" id="tukuFileInput" accept="image/*" style="display:none">
      <!-- 图片上传弹窗 -->
      <div class="modal-overlay" id="tukuModal">
        <div class="modal">
          <div class="modal-header"><h3>上传图片</h3><button class="modal-close" id="tukuModalClose">×</button></div>
          <div class="modal-body">
            <div id="tukuPreview" style="width:100%;height:150px;background:var(--bg);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:14px;margin-bottom:12px;border:2px dashed var(--border)">选择图片后预览</div>
            <div class="form-row"><label>分类</label><select id="tukuCatSelect" class="form-input"><option>证件</option><option>合同</option><option>票据</option><option>截图</option><option>其他</option></select></div>
            <div class="form-row"><label>标签(逗号分隔)</label><input type="text" id="tukuTags" class="form-input" placeholder="如 身份证,正面,2024"></div>
            <div class="form-row"><label>备注</label><input type="text" id="tukuNote" class="form-input" placeholder="可选"></div>
          </div>
          <div class="modal-footer"><button class="btn-cancel" id="tukuBtnCancel">取消</button><button class="btn-primary" id="tukuBtnSave">上传</button></div>
        </div>
      </div>
      <!-- 大图预览 -->
      <div class="modal-overlay" id="tukuViewer">
        <div style="position:relative;width:100%;max-width:480px;background:#000;padding:20px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;align-items:center">
          <button id="tukuViewerClose" style="position:absolute;top:12px;right:16px;background:none;border:none;color:#fff;font-size:24px;cursor:pointer">×</button>
          <img id="tukuViewerImg" style="max-width:100%;max-height:70vh;border-radius:8px;margin-top:20px">
          <div id="tukuViewerInfo" style="color:#ccc;font-size:13px;margin-top:12px;text-align:center"></div>
          <button id="tukuViewerDel" style="margin-top:16px;padding:12px 40px;border:1px solid var(--red);border-radius:10px;background:none;color:var(--red);font-size:15px;cursor:pointer">🗑 删除此图片</button>
        </div>
      </div>
    </div>

    <!-- ==================== 弹窗：黄金交易 ==================== -->
    <div class="modal-overlay" id="goldModal">
      <div class="modal">
        <div class="modal-header"><h3>新增交易</h3><button class="modal-close" id="goldModalClose">×</button></div>
        <div class="modal-body">
          <div class="form-row"><label>日期</label><input type="date" id="goldDate" class="form-input"></div>
          <div class="form-row"><label>克重 (g)</label><input type="number" id="goldWeight" class="form-input" placeholder="如 0.11" step="0.001"></div>
          <div class="form-row"><label>成本 (元)</label><input type="number" id="goldCostPrice" class="form-input" placeholder="如 66.08" step="0.01"></div>
          <div class="form-row"><label>备注</label><input type="text" id="goldNote" class="form-input" placeholder="可选"></div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" id="goldBtnCancel">取消</button>
          <button class="btn-primary" id="goldBtnSave">保存</button>
        </div>
      </div>
    </div>

    <!-- ==================== 弹窗：账目记录 ==================== -->
    <div class="modal-overlay" id="cModal">
      <div class="modal">
        <div class="modal-header"><h3>新增记录</h3><button class="modal-close" id="cModalClose">×</button></div>
        <div class="modal-body">
          <div class="form-row"><label>日期</label><input type="date" id="cDate" class="form-input"></div>
          <div class="form-row"><label>账号</label><input type="text" id="cAccount" class="form-input" placeholder="如 134"></div>
          <div class="form-row"><label>项目</label><input type="text" id="cProject" class="form-input" placeholder="如 快递"></div>
          <div class="form-row"><label>金额 (元)</label><input type="number" id="cAmount" class="form-input" placeholder="如 57.86" step="0.01"></div>
          <div class="form-row"><label>备注</label><input type="text" id="cNote" class="form-input" placeholder="可选"></div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" id="cBtnCancel">取消</button>
          <button class="btn-primary" id="cBtnSave">保存</button>
        </div>
      </div>
    </div>

    <footer class="footer"><span>工作台 v2.0</span></footer>
  </div>
  <script>
/* ===== 工作台 - 双用户双App ===== */
(function() {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d) { return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtMoney(n) { return '¥'+(Math.round(n*100)/100).toFixed(2); }
  function fmtWeight(n) { return (Math.round(n*1000)/1000).toFixed(3)+'g'; }
  function fmtPercent(n) { var s=n>=0?'+':''; return s+(Math.round(n*100)/100).toFixed(2)+'%'; }

  // ===== 用户切换 =====
  var currentUser = 'zhuzhu';

  function switchUser(user) {
    if (currentUser === user) return;
    currentUser = user;
    $('btnUserZhuzhu').classList.toggle('active', user==='zhuzhu');
    $('btnUserCainiao').classList.toggle('active', user==='cainiao');
    $('btnUserTuku').classList.toggle('active', user==='tuku');
    $('logoSub').textContent = user==='zhuzhu' ? '珠珠 · 黄金交易' : (user==='cainiao' ? '菜鸟 · 账目记录' : '图库 · 图片管理');
    $('viewZhuzhu').classList.toggle('active', user==='zhuzhu');
    $('viewCainiao').classList.toggle('active', user==='cainiao');
    $('viewTuku').classList.toggle('active', user==='tuku');
    if (user==='zhuzhu') refreshGold();
    else if (user==='cainiao') refreshCainiao();
    else if (user==='tuku') renderTuku();
  }

  $('btnUserZhuzhu').addEventListener('click', function(){switchUser('zhuzhu')});
  $('btnUserCainiao').addEventListener('click', function(){switchUser('cainiao')});
  $('btnUserTuku').addEventListener('click', function(){switchUser('tuku')});

  // ===== 本地存储辅助 =====
  function lsGet(key, def) {
    try { var r=localStorage.getItem(key); return r ? JSON.parse(r) : def; } catch(e) { return def; }
  }
  function lsSet(key, v) { localStorage.setItem(key, JSON.stringify(v)); }

  // ==================== 珠珠：黄金交易 ====================
  var GOLD_TRADES_KEY = 'taizhang_zhuzhu_trades';
  var GOLD_PRICE_KEY = 'taizhang_zhuzhu_goldPrice';

  function loadGoldTrades() { return lsGet(GOLD_TRADES_KEY, []); }
  function saveGoldTrades(t) { lsSet(GOLD_TRADES_KEY, t); }
  function loadGoldPrice() { return lsGet(GOLD_PRICE_KEY, {price:0,time:''}); }
  function saveGoldPrice(p, t) { lsSet(GOLD_PRICE_KEY, {price:p, time:t}); }

  function fetchGoldPrice() {
    $('goldPrice').textContent = '加载中...';
    fetch('https://api.it120.cc/free/open/gold/price', {method:'GET',mode:'cors'})
      .then(function(r){return r.json()})
      .then(function(d){
        var p = (d&&d.data&&d.data.price) ? parseFloat(d.data.price) : 0;
        if (p<=0) p = 891.86;
        var now = new Date();
        var ts = now.getFullYear()+'/'+pad(now.getMonth()+1)+'/'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
        saveGoldPrice(p, ts);
        $('goldPrice').textContent = p.toFixed(2);
        $('goldTime').textContent = ts;
        refreshGold();
      })
      .catch(function(){
        var p = 891.86;
        var now = new Date();
        var ts = now.getFullYear()+'/'+pad(now.getMonth()+1)+'/'+pad(now.getDate())+' '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
        saveGoldPrice(p, ts);
        $('goldPrice').textContent = p.toFixed(2);
        $('goldTime').textContent = ts;
        refreshGold();
      });
  }

  function refreshGold() {
    var trades = loadGoldTrades();
    var gp = loadGoldPrice();
    var cp = gp.price || 0;

    if (cp > 0) {
      $('goldPrice').textContent = cp.toFixed(2);
      $('goldTime').textContent = gp.time;
    }

    var tw=0, tc=0;
    trades.forEach(function(t){ tw+=t.weight; tc+=t.costPrice; });
    var tv = tw*cp;
    var profit = tv-tc;
    var rate = tc>0 ? (profit/tc)*100 : 0;

    $('ovTotalWeight').textContent = fmtWeight(tw);
    $('ovTotalCost').textContent = fmtMoney(tc);
    var pe = $('ovTotalProfit'); pe.textContent = (profit>=0?'+':'')+fmtMoney(profit); pe.className = 'ov-value '+(profit>=0?'green':'red');
    var re = $('ovProfitRate'); re.textContent = fmtPercent(rate); re.className = 'ov-value '+(rate>=0?'green':'red');

    // 交易列表 - 按日期汇总
    var list = $('tradeList');
    if (trades.length===0) {
      list.innerHTML = '<div class="empty-state">暂无交易记录,点击右下角 + 添加</div>';
    } else {
      // 按日期分组汇总
      var byDate = {};
      trades.forEach(function(t){
        if (!byDate[t.date]) byDate[t.date] = { date: t.date, weight: 0, cost: 0, ids: [] };
        byDate[t.date].weight += t.weight;
        byDate[t.date].cost += t.costPrice;
        byDate[t.date].ids.push(t.id);
      });
      var dates = Object.keys(byDate).sort().reverse();
      list.innerHTML = '';
      dates.forEach(function(d){
        var g = byDate[d];
        var profit = cp > 0 ? (cp * g.weight) - g.cost : 0;
        var c = document.createElement('div'); c.className='trade-card';
        c.style.flexDirection='column';
        c.style.alignItems='stretch';
        c.innerHTML =
          '<div style="display:flex;align-items:center;gap:12px;width:100%">'+
            '<div class="trade-date">'+g.date+'</div>'+
            '<div class="trade-weight">'+fmtWeight(g.weight)+'</div>'+
            '<div class="trade-cost">'+fmtMoney(g.cost)+'</div>'+
            '<div class="trade-profit" style="color:'+(profit>=0?'var(--green)':'var(--red)')+'">'+(profit>=0?'+':'')+fmtMoney(profit)+'</div>'+
          '</div>'+
          '<div style="display:flex;gap:8px;margin-top:10px;width:100%">'+
            '<button class="trade-edit" data-date="'+g.date+'" style="flex:1;padding:10px;border:1px solid var(--primary);border-radius:8px;background:#eff6ff;color:var(--primary);font-size:15px;cursor:pointer;font-family:inherit">✏️ 编辑</button>'+
            '<button class="trade-del" data-date="'+g.date+'" style="flex:1;padding:10px;border:1px solid var(--red);border-radius:8px;background:#fef2f2;color:var(--red);font-size:15px;cursor:pointer;font-family:inherit">🗑 删除</button>'+
          '</div>';
        list.appendChild(c);
      });
    }
  }

  // 黄金：弹窗(新增/编辑)
  var goldEditingDate = null;
  (function(){
    var overlay = $('goldModal');
    $('btnAddGold').addEventListener('click', function(){
      goldEditingDate = null;
      $('goldModal').querySelector('h3').textContent = '新增交易';
      $('goldDate').value = fmtDate(new Date()); $('goldWeight').value=''; $('goldCostPrice').value=''; $('goldNote').value='';
      overlay.classList.add('show');
    });
    $('goldModalClose').addEventListener('click', function(){ overlay.classList.remove('show'); });
    $('goldBtnCancel').addEventListener('click', function(){ overlay.classList.remove('show'); });
    $('goldBtnSave').addEventListener('click', function(){
      var d=$('goldDate').value, w=parseFloat($('goldWeight').value), p=parseFloat($('goldCostPrice').value), n=$('goldNote').value.trim();
      if (!d||isNaN(w)||w<=0||isNaN(p)||p<=0) { alert('请填写完整信息'); return; }
      var trades = loadGoldTrades();
      if (goldEditingDate !== null) {
        // 编辑：删除当天所有，替换为一条新的
        trades = trades.filter(function(t){ return t.date !== goldEditingDate; });
        trades.push({id:Date.now(),date:d,weight:w,costPrice:p,note:n});
      } else {
        trades.push({id:Date.now(),date:d,weight:w,costPrice:p,note:n});
      }
      saveGoldTrades(trades);
      overlay.classList.remove('show');
      refreshGold();
    });
    overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.classList.remove('show'); });
  })();

  // 黄金：编辑/删除(按日期)
  $('tradeList').addEventListener('click', function(e){
    var date = e.target.dataset.date;
    if (!date) return;
    if (e.target.classList.contains('trade-edit')) {
      // 编辑：取出当天数据填入弹窗
      var dayTrades = loadGoldTrades().filter(function(t){return t.date===date});
      if (dayTrades.length===0) return;
      var tw=0, tc=0;
      dayTrades.forEach(function(t){tw+=t.weight; tc+=t.costPrice;});
      goldEditingDate = date;
      $('goldModal').querySelector('h3').textContent = '编辑 '+date;
      $('goldDate').value = date;
      $('goldWeight').value = tw.toFixed(3);
      $('goldCostPrice').value = tc.toFixed(2);
      $('goldNote').value = dayTrades[0].note||'';
      $('goldModal').classList.add('show');
    } else if (e.target.classList.contains('trade-del')) {
      if (confirm('确定删除 '+date+' 的所有记录?')) {
        var t = loadGoldTrades().filter(function(x){return x.date !== date});
        saveGoldTrades(t); refreshGold();
      }
    }
  });

  // 黄金：导出导入
  $('btnGoldExport').addEventListener('click', function(){
    var t=loadGoldTrades(), gp=loadGoldPrice();
    if (t.length===0){alert('无数据');return;}
    var blob = new Blob([JSON.stringify({v:1,user:'zhuzhu',exportedAt:new Date().toISOString(),goldPrice:gp,trades:t},null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='黄金交易_珠珠_'+fmtDate(new Date())+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    alert('已导出 '+t.length+' 条');
  });
  $('btnGoldImport').addEventListener('click', function(){ $('goldImportFile').click(); });
  $('goldImportFile').addEventListener('change', function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(ev){
      try {
        var d=JSON.parse(ev.target.result);
        if(!d.trades||!Array.isArray(d.trades)) throw new Error();
        var exist=loadGoldTrades(), ids={}, added=0;
        exist.forEach(function(x){ids[x.id]=true});
        d.trades.forEach(function(x){if(!ids[x.id]){exist.push(x);added++}});
        if(added===0){alert('无新记录');}else{saveGoldTrades(exist);refreshGold();alert('已导入 '+added+' 条');}
        if(d.goldPrice&&d.goldPrice.price>0) saveGoldPrice(d.goldPrice.price,d.goldPrice.time);
      }catch(ex){alert('格式错误');}
    };
    r.readAsText(f); e.target.value='';
  });

  // 黄金：刷新金价
  $('btnRefreshPrice').addEventListener('click', fetchGoldPrice);

  // ==================== 菜鸟：账目记录 ====================
  var C_KEY = 'taizhang_cainiao_records';

  function loadCRecords() { return lsGet(C_KEY, []); }
  function saveCRecords(r) { lsSet(C_KEY, r); }

  function refreshCainiao() {
    var records = loadCRecords();
    var total=0, accts={}, projs={};
    records.forEach(function(r){ total+=r.amount; accts[r.account]=true; projs[r.project]=true; });

    $('cTotalAmount').textContent = fmtMoney(total);
    $('cTotalCount').textContent = records.length;
    $('cAccountCount').textContent = Object.keys(accts).length;
    $('cProjectCount').textContent = Object.keys(projs).length;

    renderCByDate(records);
    renderCByAccount(records);
    renderCByProject(records);
    renderCRecords(records);
  }

  function renderCByDate(records) {
    var g={}, body=$('cByDateBody'), tc=0, ta=0;
    records.forEach(function(r){ if(!g[r.date]) g[r.date]={c:0,a:0}; g[r.date].c++; g[r.date].a+=r.amount; });
    var dates=Object.keys(g).sort().reverse();
    body.innerHTML = dates.length===0 ? '<div class="empty-state">暂无记录</div>' : '';
    dates.forEach(function(d){ var v=g[d]; tc+=v.c; ta+=v.a;
      var row=document.createElement('div'); row.className='dt-row';
      row.innerHTML='<span>'+d+'</span><span>'+v.c+'</span><span class="amount">'+fmtMoney(v.a)+'</span>';
      body.appendChild(row);
    });
    $('cByDateCount').textContent=tc; $('cByDateAmount').textContent=fmtMoney(ta);
  }

  function renderCByAccount(records) {
    var g={}, body=$('cByAccountBody'), tc=0, ta=0;
    records.forEach(function(r){ if(!g[r.account]) g[r.account]={c:0,a:0}; g[r.account].c++; g[r.account].a+=r.amount; });
    var accts=Object.keys(g).sort();
    body.innerHTML = accts.length===0 ? '<div class="empty-state">暂无记录</div>' : '';
    accts.forEach(function(a){ var v=g[a]; tc+=v.c; ta+=v.a;
      var row=document.createElement('div'); row.className='dt-row';
      row.innerHTML='<span>'+a+'</span><span>'+v.c+'</span><span class="amount">'+fmtMoney(v.a)+'</span>';
      body.appendChild(row);
    });
    $('cByAccountCount').textContent=tc; $('cByAccountAmount').textContent=fmtMoney(ta);
  }

  function renderCByProject(records) {
    var g={}, body=$('cByProjectBody'), tc=0, ta=0;
    records.forEach(function(r){ if(!g[r.project]) g[r.project]={c:0,a:0}; g[r.project].c++; g[r.project].a+=r.amount; });
    var projs=Object.keys(g).sort();
    body.innerHTML = projs.length===0 ? '<div class="empty-state">暂无记录</div>' : '';
    projs.forEach(function(p){ var v=g[p]; tc+=v.c; ta+=v.a;
      var row=document.createElement('div'); row.className='dt-row';
      row.innerHTML='<span>'+p+'</span><span>'+v.c+'</span><span class="amount">'+fmtMoney(v.a)+'</span>';
      body.appendChild(row);
    });
    $('cByProjectCount').textContent=tc; $('cByProjectAmount').textContent=fmtMoney(ta);
  }

  function renderCRecords(records) {
    var list=$('cRecordsList');
    if (records.length===0) { list.innerHTML='<div class="empty-state">暂无记录</div>'; return; }
    list.innerHTML='';
    records.slice().reverse().forEach(function(r){
      var card=document.createElement('div'); card.className='record-card';
      card.style.flexDirection='column';
      card.style.alignItems='stretch';
      card.innerHTML=
        '<div style="display:flex;justify-content:space-between;align-items:center;width:100%">'+
          '<div class="record-info"><div class="record-date">'+r.date+'</div><div class="record-detail"><span class="tag">'+r.account+'</span><span class="tag">'+r.project+'</span>'+(r.note?'<span>'+r.note+'</span>':'')+'</div></div>'+
          '<div class="record-amount">'+fmtMoney(r.amount)+'</div>'+
        '</div>'+
        '<div style="display:flex;gap:8px;margin-top:10px;width:100%">'+
          '<button class="record-edit" data-id="'+r.id+'" style="flex:1;padding:10px;border:1px solid var(--primary);border-radius:8px;background:#eff6ff;color:var(--primary);font-size:15px;cursor:pointer;font-family:inherit">✏️ 编辑</button>'+
          '<button class="record-del" data-id="'+r.id+'" style="flex:1;padding:10px;border:1px solid var(--red);border-radius:8px;background:#fef2f2;color:var(--red);font-size:15px;cursor:pointer;font-family:inherit">🗑 删除</button>'+
        '</div>';
      list.appendChild(card);
    });
  }

  // 菜鸟：标签切换
  (function(){
    var tabs=document.querySelectorAll('#viewCainiao .tab');
    var panels=document.querySelectorAll('#viewCainiao .c-panel');
    tabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        tabs.forEach(function(t){t.classList.remove('active')});
        panels.forEach(function(p){p.classList.remove('active')});
        this.classList.add('active');
        document.getElementById(this.dataset.tab).classList.add('active');
      });
    });
  })();

  // 菜鸟：新增/编辑弹窗
  var cEditingId = null;
  (function(){
    var overlay=$('cModal');
    $('btnAddRecord').addEventListener('click', function(){
      cEditingId = null;
      $('cModal').querySelector('h3').textContent = '新增记录';
      $('cDate').value=fmtDate(new Date()); $('cAccount').value=''; $('cProject').value=''; $('cAmount').value=''; $('cNote').value='';
      overlay.classList.add('show');
    });
    $('cModalClose').addEventListener('click', function(){overlay.classList.remove('show')});
    $('cBtnCancel').addEventListener('click', function(){overlay.classList.remove('show')});
    $('cBtnSave').addEventListener('click', function(){
      var d=$('cDate').value, a=$('cAccount').value.trim(), p=$('cProject').value.trim(), m=parseFloat($('cAmount').value), n=$('cNote').value.trim();
      if(!d||!a||!p||isNaN(m)||m<=0){alert('请填写完整信息');return;}
      var records=loadCRecords();
      if (cEditingId !== null) {
        // 编辑模式
        records = records.map(function(r){ return r.id===cEditingId ? {id:r.id,date:d,account:a,project:p,amount:m,note:n} : r; });
      } else {
        // 新增
        records.push({id:Date.now(),date:d,account:a,project:p,amount:m,note:n});
      }
      saveCRecords(records); overlay.classList.remove('show'); refreshCainiao();
    });
    overlay.addEventListener('click', function(e){if(e.target===overlay)overlay.classList.remove('show')});
  })();

  // 菜鸟：编辑/删除
  $('cRecordsList').addEventListener('click', function(e){
    var id=parseInt(e.target.dataset.id);
    if(e.target.classList.contains('record-edit')){
      var r = loadCRecords().find(function(x){return x.id===id});
      if (!r) return;
      cEditingId = id;
      $('cModal').querySelector('h3').textContent = '编辑记录';
      $('cDate').value=r.date; $('cAccount').value=r.account; $('cProject').value=r.project; $('cAmount').value=r.amount; $('cNote').value=r.note||'';
      $('cModal').classList.add('show');
    } else if(e.target.classList.contains('record-del')){
      if(confirm('确定删除?')){
        var records=loadCRecords().filter(function(r){return r.id!==id});
        saveCRecords(records); refreshCainiao();
      }
    }
  });

  // 菜鸟：导出导入
  $('btnCExport').addEventListener('click', function(){
    var r=loadCRecords(); if(r.length===0){alert('无数据');return;}
    var blob=new Blob([JSON.stringify({v:1,user:'cainiao',exportedAt:new Date().toISOString(),records:r},null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='账目记录_菜鸟_'+fmtDate(new Date())+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    alert('已导出 '+r.length+' 条');
  });
  $('btnCImport').addEventListener('click', function(){ $('cImportFile').click(); });
  $('cImportFile').addEventListener('change', function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(ev){
      try{
        var d=JSON.parse(ev.target.result);
        if(!d.records||!Array.isArray(d.records)) throw new Error();
        var exist=loadCRecords(), ids={}, added=0;
        exist.forEach(function(x){ids[x.id]=true});
        d.records.forEach(function(x){if(!ids[x.id]){exist.push(x);added++}});
        if(added===0){alert('无新记录');}else{saveCRecords(exist);refreshCainiao();alert('已导入 '+added+' 条');}
      }catch(ex){alert('格式错误');}
    };
    r.readAsText(f); e.target.value='';
  });

  // ==================== 图库：图片管理 ====================
  var TUKU_KEY = 'taizhang_tuku_images';
  var tukuCurrentCat = '全部';
  var tukuSearchTerm = '';

  function loadTuku() { return lsGet(TUKU_KEY, []); }
  function saveTuku(d) { lsSet(TUKU_KEY, d); }

  function renderTuku() {
    var images = loadTuku();
    var grid = $('tukuGrid');
    // 筛选
    if (tukuCurrentCat !== '全部') images = images.filter(function(x){return x.cat===tukuCurrentCat});
    if (tukuSearchTerm) {
      var s = tukuSearchTerm.toLowerCase();
      images = images.filter(function(x){
        return (x.tags||'').toLowerCase().indexOf(s)>=0 || (x.note||'').toLowerCase().indexOf(s)>=0 || (x.cat||'').toLowerCase().indexOf(s)>=0;
      });
    }
    if (images.length===0) { grid.innerHTML='<div class="empty-state" style="grid-column:span 3">暂无图片</div>'; return; }
    grid.innerHTML='';
    images.slice().reverse().forEach(function(img){
      var item = document.createElement('div');
      item.style.cssText='background:var(--card-bg);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative';
      item.innerHTML='<div style="width:100%;padding-top:100%;position:relative;overflow:hidden"><img src="'+img.url+'" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.src=\\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23ddd%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2212%22>加载失败</text></svg>\\'"></div><div style="padding:6px 8px;font-size:11px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+img.cat+'</div>';
      item.addEventListener('click', function(){ viewTuku(img); });
      grid.appendChild(item);
    });
  }

  function viewTuku(img) {
    $('tukuViewerImg').src = img.url;
    $('tukuViewerInfo').textContent = (img.cat||'') + ' | ' + (img.tags||'') + (img.note?' | '+img.note:'') + ' | ' + (img.time||'');
    $('tukuViewer').classList.add('show');
    $('tukuViewerDel').dataset.id = img.id;
  }

  // 上传弹窗
  (function(){
    var overlay = $('tukuModal');
    var fileInput = $('tukuFileInput');
    var selectedFile = null;

    $('btnUploadImg').addEventListener('click', function(){
      selectedFile = null;
      $('tukuPreview').innerHTML = '选择图片后预览';
      $('tukuPreview').style.backgroundImage = '';
      $('tukuCatSelect').value = '其他';
      $('tukuTags').value = '';
      $('tukuNote').value = '';
      overlay.classList.add('show');
    });
    $('tukuModalClose').addEventListener('click', function(){overlay.classList.remove('show')});
    $('tukuBtnCancel').addEventListener('click', function(){overlay.classList.remove('show')});

    $('tukuPreview').addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(e){
      var f = e.target.files[0];
      if (!f) return;
      selectedFile = f;
      var reader = new FileReader();
      reader.onload = function(ev){
        $('tukuPreview').innerHTML = '';
        $('tukuPreview').style.backgroundImage = 'url('+ev.target.result+')';
        $('tukuPreview').style.backgroundSize = 'contain';
        $('tukuPreview').style.backgroundRepeat = 'no-repeat';
        $('tukuPreview').style.backgroundPosition = 'center';
      };
      reader.readAsDataURL(f);
    });

    $('tukuBtnSave').addEventListener('click', function(){
      if (!selectedFile) { alert('请先选择图片'); return; }
      $('tukuBtnSave').textContent = '上传中...';
      $('tukuBtnSave').disabled = true;

      var formData = new FormData();
      formData.append('smfile', selectedFile);
      formData.append('format', 'json');

      fetch('https://sm.ms/api/v2/upload', {method:'POST',body:formData})
        .then(function(r){return r.json()})
        .then(function(d){
          $('tukuBtnSave').textContent = '上传';
          $('tukuBtnSave').disabled = false;
          if (d.success && d.data && d.data.url) {
            var images = loadTuku();
            var cat = $('tukuCatSelect').value;
            var tags = $('tukuTags').value.trim();
            var note = $('tukuNote').value.trim();
            var now = new Date();
            var timeStr = now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate();
            images.push({id:Date.now(), url:d.data.url, thumb:d.data.url, cat:cat, tags:tags, note:note, time:timeStr});
            saveTuku(images);
            overlay.classList.remove('show');
            renderTuku();
          } else {
            alert('上传失败: '+(d.message||'未知错误'));
          }
        })
        .catch(function(){
          $('tukuBtnSave').textContent = '上传';
          $('tukuBtnSave').disabled = false;
          alert('上传失败,请检查网络');
        });
    });

    overlay.addEventListener('click', function(e){if(e.target===overlay)overlay.classList.remove('show')});
  })();

  // 大图预览
  $('tukuViewerClose').addEventListener('click', function(){$('tukuViewer').classList.remove('show')});
  $('tukuViewer').addEventListener('click', function(e){if(e.target===$('tukuViewer'))$('tukuViewer').classList.remove('show')});
  $('tukuViewerDel').addEventListener('click', function(){
    var id = parseInt(this.dataset.id);
    if (confirm('确定删除?')) {
      var images = loadTuku().filter(function(x){return x.id!==id});
      saveTuku(images); renderTuku(); $('tukuViewer').classList.remove('show');
    }
  });

  // 分类筛选
  $('tukuCats').addEventListener('click', function(e){
    if (e.target.classList.contains('tuku-cat')) {
      tukuCurrentCat = e.target.dataset.cat;
      var cats = document.querySelectorAll('.tuku-cat');
      cats.forEach(function(c){c.classList.remove('active');c.style.background='var(--card-bg)';c.style.color='var(--text-dim)';c.style.borderColor='var(--border)'});
      e.target.classList.add('active');e.target.style.background='var(--primary)';e.target.style.color='#fff';e.target.style.borderColor='var(--primary)';
      renderTuku();
    }
  });

  // 搜索
  $('tukuSearchBtn').addEventListener('click', function(){
    tukuSearchTerm = $('tukuSearch').value.trim();
    renderTuku();
  });
  $('tukuSearch').addEventListener('keypress', function(e){
    if (e.key==='Enter') { tukuSearchTerm = this.value.trim(); renderTuku(); }
  });

  // ===== 初始化 =====
  function init() {
    // 恢复上次金价显示
    var gp = loadGoldPrice();
    if (gp.price > 0) { $('goldPrice').textContent = gp.price.toFixed(2); $('goldTime').textContent = gp.time; }
    refreshGold();
    refreshCainiao();
    renderTuku();
  }

  if (document.readyState==='loading') { document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();
  </script>
</body>
</html>
