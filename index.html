<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>工作台 - 黄金交易</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header class="header">
      <div class="header-left">
        <div class="logo-icon">📊</div>
        <div class="logo-text">
          <div class="logo-title">工作台</div>
          <div class="logo-sub" id="logoSub">珠珠 · 黄金交易</div>
        </div>
      </div>
      <div class="header-right">
        <button class="user-badge active" id="btnUserZhuzhu">
          <span class="user-icon">💎</span>
          <span class="user-name">珠珠</span>
        </button>
        <button class="user-badge" id="btnUserCainiao">
          <span class="user-icon">🐦</span>
          <span class="user-name">菜鸟</span>
        </button>
      </div>
    </header>

    <!-- 实时金价 -->
    <section class="gold-price-card">
      <div class="gp-header">
        <span class="gp-label">实时金价</span>
        <button class="gp-refresh" id="btnRefreshPrice">刷新</button>
      </div>
      <div class="gp-value">
        <span id="goldPrice">--</span>
        <span class="gp-unit">元/克</span>
      </div>
      <div class="gp-info">
        <span id="goldChange">涨跌 --</span>
        <span id="goldTime">--</span>
      </div>
    </section>

    <!-- 总览 -->
    <section class="overview-card">
      <div class="overview-title">📈 总览</div>
      <div class="overview-grid">
        <div class="ov-item">
          <div class="ov-label">总克重</div>
          <div class="ov-value orange" id="ovTotalWeight">0g</div>
        </div>
        <div class="ov-item">
          <div class="ov-label">总成本</div>
          <div class="ov-value blue" id="ovTotalCost">¥0.00</div>
        </div>
        <div class="ov-item">
          <div class="ov-label">总利润</div>
          <div class="ov-value green" id="ovTotalProfit">+¥0.00</div>
        </div>
        <div class="ov-item">
          <div class="ov-label">利润率</div>
          <div class="ov-value green" id="ovProfitRate">+0.00%</div>
        </div>
      </div>
    </section>

    <!-- 交易记录 -->
    <section class="trade-section">
      <div class="section-header">
        <h3>📝 交易记录</h3>
        <div class="btn-group">
          <button class="btn-outline" id="btnExport">导出</button>
          <input type="file" id="importFileInput" accept=".json" style="display:none">
          <button class="btn-outline" id="btnImport">导入</button>
        </div>
      </div>
      <div class="trade-list" id="tradeList"></div>
    </section>

    <!-- 悬浮新增按钮 -->
    <button class="fab" id="btnAddTrade">+</button>

    <!-- 新增交易弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h3>新增交易</h3>
          <button class="modal-close" id="modalClose">×</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <label>日期</label>
            <input type="date" id="tradeDate" class="form-input">
          </div>
          <div class="form-row">
            <label>克重 (g)</label>
            <input type="number" id="tradeWeight" class="form-input" placeholder="如 0.11" step="0.001">
          </div>
          <div class="form-row">
            <label>成本价 (元/克)</label>
            <input type="number" id="tradeCostPrice" class="form-input" placeholder="如 600.73" step="0.01">
          </div>
          <div class="form-row">
            <label>备注</label>
            <input type="text" id="tradeNote" class="form-input" placeholder="可选">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" id="btnCancel">取消</button>
          <button class="btn-primary" id="btnSave">保存</button>
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <footer class="footer">
      <span>工作台 v1.0</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
